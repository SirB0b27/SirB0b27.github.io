<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workspaces | SirB0b27</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101622;color:#eaf0fc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top right,#19345b 0%,#101622 52%);display:flex;align-items:center;justify-content:center;padding:28px}
main{width:min(1020px,100%)}.eyebrow{font-size:12px;color:#9fbbdf;text-transform:uppercase;letter-spacing:.15em;font-weight:700}
h1{font-size:clamp(30px,5vw,49px);letter-spacing:-.045em;margin:12px 0}p{color:#aebcd2;line-height:1.7;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{color:inherit;background:#1b2840cc;border:1px solid #364d6b;border-radius:15px;padding:24px;text-align:left;min-height:250px;display:flex;flex-direction:column;align-items:start;cursor:pointer;text-decoration:none;transition:background .18s,border-color .18s,transform .18s}
.card:hover{background:#233752;border-color:#85b3ee;transform:translateY(-3px)}.card:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #85b3ee;outline-offset:3px}
.icon{display:grid;place-items:center;width:49px;height:49px;border:1px solid #44668f;border-radius:12px;color:#bbdafe;margin-bottom:25px}
svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.card strong{font-size:21px}.card .desc{color:#b0c0d9;line-height:1.55;font-size:13px;margin-top:8px}.card .open{margin-top:auto;padding-top:22px;color:#b0d6ff;font-size:12px;font-weight:700}
dialog{background:#1a2940;border:1px solid #5379a8;border-radius:17px;color:#edf4ff;padding:25px;width:min(420px,calc(100vw - 34px));box-shadow:0 25px 85px #0009}
dialog::backdrop{background:#060c18c9}dialog h2{margin:6px 0 7px}dialog p{font-size:13px;margin:0 0 18px}label{display:block;font-size:13px;margin-bottom:7px}
input{width:100%;padding:13px 12px;background:#101a2b;border:1px solid #54729b;border-radius:8px;color:white;font:inherit}input:focus{outline:2px solid #85b3ee}
.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}button{font:inherit;cursor:pointer}
.action{border:1px solid #56749c;background:#223751;color:white;padding:10px 14px;border-radius:8px}.primary{background:#2768a9;border-color:#4295e3}
.error{color:#ffa8a8;font-size:12px;margin-top:11px}
@media(max-width:750px){.grid{grid-template-columns:1fr}.card{min-height:170px}.icon{margin-bottom:14px}body{align-items:start;padding-top:55px}}
</style></head><body><main><div class="eyebrow">Home / Workspaces</div><h1>Choose a workspace</h1><p>Explore the professional portfolio, birthday projects, or the personal workspace.</p>
<div class="grid">
<button type="button" class="card" data-space="portfolio"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg></span><strong>Portfolio</strong><span class="desc">Overview, Experience, Projects, Skills & Technologies, Education and Resume.</span><span class="open">🔒 Enter Portfolio →</span></button>
<a class="card" href="birthdays/"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 10h16v11H4zM3 10h18M7 10V7m5 3V7m5 3V7M6 6c-1-2 0-3 1-4 2 1 2 3 0 4m5 0c-1-2 0-3 1-4 2 1 2 3 0 4m5 0c-1-2 0-3 1-4 2 1 2 3 0 4"/></svg></span><strong>Birthdays</strong><span class="desc">Browse Kaju's birthday activities, questionnaire and game.</span><span class="open">Open Birthdays →</span></a>
<button type="button" class="card" data-space="personal"><span class="icon"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span><strong>Personal</strong><span class="desc">Open the separate password-protected personal workspace.</span><span class="open">🔒 Enter Personal →</span></button>
</div></main>
<dialog id="gate" aria-labelledby="gateTitle"><form id="gateForm"><div class="eyebrow">Private Workspace</div><h2 id="gateTitle">Portfolio</h2><p>Enter the password to continue.</p><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div id="error" class="error" hidden>Incorrect password.</div><div class="actions"><button class="action" type="button" id="cancel">Cancel</button><button class="action primary" type="submit">Continue</button></div></form></dialog>
<script>
(()=>{
const HASH='d0f1e3c007d7e9411923d1922fb8364004ca9eaf7b8aee6cb1955104e35f2dca';
const dialog=document.getElementById('gate'),input=document.getElementById('password'),title=document.getElementById('gateTitle'),error=document.getElementById('error');
let selected='portfolio';
function openGate(space){selected=space;title.textContent=space==='portfolio'?'Portfolio':'Personal';input.value='';error.hidden=true;dialog.showModal();input.focus()}
document.querySelectorAll('[data-space]').forEach(b=>b.addEventListener('click',()=>openGate(b.dataset.space)));
document.getElementById('cancel').addEventListener('click',()=>dialog.close());
document.getElementById('gateForm').addEventListener('submit',async e=>{
e.preventDefault();
const bytes=new TextEncoder().encode(input.value);
const digest=await crypto.subtle.digest('SHA-256',bytes);
const hex=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');
if(hex!==HASH){error.hidden=false;input.select();return}
if(selected==='portfolio'){sessionStorage.setItem('portfolioSpaceAuth','1');location.href='portfolio/#overview'}
else{sessionStorage.setItem('personalSpaceAuth','1');location.href='personal/#home'}
});
const requested=location.hash.slice(1).toLowerCase();
if(requested==='portfolio'||requested==='personal')openGate(requested);
})();
</script></body></html>
