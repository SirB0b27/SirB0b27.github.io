<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Hemanth Velan — Business Intelligence, analytics, data science, and project portfolio.">
  <title>Hemanth Velan | Portfolio</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="menuToggle" aria-label="Toggle navigation">☰</button>
      <div class="brand-copy"><div class="brand-title">Hemanth Velan</div><div class="brand-sub">Portfolio Workspace</div></div>
    </div>
    <div class="topbar-main">
      <div class="crumb" id="crumb">Portfolio / Overview</div>
      <div class="toolbar">
        <button class="icon-btn desktop-optional" id="zoomOut" title="Zoom out">−</button>
        <span class="zoom-readout desktop-optional" id="zoomReadout">100%</span>
        <button class="icon-btn desktop-optional" id="zoomIn" title="Zoom in">+</button>
        <button class="tool-btn desktop-optional" id="fitWidth">Fit Width</button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
      </div>
    </div>
  </header>
  <aside class="sidebar" id="sidebar">
    <div class="nav-section">
      <div class="nav-label">Portfolio</div>
      <button class="nav-item active" data-route="overview"><span class="nav-icon">⌂</span><span class="nav-text">Overview</span></button>
      <button class="nav-item" data-route="experience"><span class="nav-icon">▤</span><span class="nav-text">Experience</span></button>
      <button class="nav-item" data-route="projects"><span class="nav-icon">◆</span><span class="nav-text">Projects</span><span class="nav-badge" id="projectCountBadge"></span></button>
      <button class="nav-item" data-route="skills"><span class="nav-icon">◫</span><span class="nav-text">Skills & Technologies</span></button>
      <button class="nav-item" data-route="education"><span class="nav-icon">◈</span><span class="nav-text">Education</span></button>
      <a class="nav-item" href="resume/"><span class="nav-icon">▣</span><span class="nav-text">Resume</span></a>
    </div>
    <div class="nav-separator"></div>
    <div class="nav-section">
      <div class="nav-label">Personal</div>
      <a class="nav-item" href="personal-analytics/"><span class="nav-icon">▦</span><span class="nav-text">Personal Analytics</span><span class="nav-badge">🔒</span></a>
      <div class="nav-sublabel">Archived</div>
      <a class="nav-item nav-subitem" href="college-projects/"><span class="nav-icon">◧</span><span class="nav-text">College Projects</span><span class="nav-badge">🔒</span></a>
    </div>
    <div class="nav-separator"></div>
    <div class="nav-section">
      <div class="nav-label">Links</div>
      <a class="nav-item" href="https://github.com/SirB0b27" target="_blank" rel="noopener"><span class="nav-icon">↗</span><span class="nav-text">GitHub</span></a>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="workspace" id="workspace">
      <section class="view active" data-view="overview"></section>
      <section class="view" data-view="experience"></section>
      <section class="view" data-view="projects"></section>
      <section class="view" data-view="skills"></section>
      <section class="view" data-view="education"></section>
    </div>
  </main>
</div>
<script src="data/portfolio-data.js"></script>
<script src="data/education-catalog.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
