<!doctype html><html lang="en"><head><script>(()=>{const until=Number(localStorage.getItem('collegeProjectsUnlockedUntil')||0);if(until<=Date.now()){localStorage.removeItem('collegeProjectsUnlockedUntil');location.replace('../../college-projects/');}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT 201 — Assignment 5</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f5f5}.wrap{max-width:680px;margin:40px auto;padding:24px;background:#fff;border:1px solid #ddd}.chat .messages{width:auto;height:320px;background:#fafafa}.chat .entry{width:100%;box-sizing:border-box}.note{font-size:12px;background:#fff5d9;border:1px solid #ead69a;padding:10px;margin-bottom:16px}.row{display:flex;gap:8px;margin-top:7px}.row button{padding:8px 14px}.message{padding:6px 0;border-bottom:1px solid #eee}.message a{font-weight:bold;text-decoration:none}</style></head><body><div class="wrap"><h1>Assignment 5 — Chat</h1><div class="note">Compatibility recreation for GitHub Pages. The repository preserves the original <code>chatbridge.php</code>, <code>init.php</code>, and stylesheet, but the referenced server-side Chat/Core classes are not present, so this demo keeps messages locally in your browser.</div><div class="chat"><div class="messages" id="messages"></div><textarea class="entry" id="entry" placeholder="Enter a message"></textarea><div class="row"><input id="name" value="Visitor" aria-label="Display name"><button id="send">Send</button><button id="clear">Clear</button></div></div></div><script>const key='it201-assignment5-chat-demo';const q=s=>document.querySelector(s);let msgs=JSON.parse(localStorage.getItem(key)||'[]');function clean(s){return String(s).replace(/[<>]/g,'')}function draw(){q('#messages').innerHTML=msgs.length?msgs.map(m=>'<div class="message"><a href="#">'+clean(m.name)+'</a> says:<p>'+clean(m.text)+'</p></div>').join(''):'There are no messages in the chat';q('#messages').scrollTop=q('#messages').scrollHeight}q('#send').onclick=()=>{const text=q('#entry').value.trim();if(!text)return;msgs.push({name:q('#name').value.trim()||'Visitor',text});localStorage.setItem(key,JSON.stringify(msgs));q('#entry').value='';draw()};q('#clear').onclick=()=>{msgs=[];localStorage.removeItem(key);draw()};draw();</script></body></html>
