<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>College Projects | Hemanth Velan</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .project-shell{min-height:100vh;background:var(--bg)}.project-topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.project-brand{display:flex;align-items:center;gap:10px}.project-body{padding:20px;max-width:1500px;margin:auto}.course-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.course-head{padding:15px 16px;border-bottom:1px solid var(--line)}.course-head h1{font-size:20px;margin:0}.course-head p{font-size:11px;color:var(--muted);margin:5px 0 0}.assignment-tabs{display:flex;gap:2px;overflow:auto;padding:10px 10px 0;background:var(--panel-2);border-bottom:1px solid var(--line)}.assignment-tab{border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap}.assignment-tab.active{background:var(--panel);color:var(--text);border-color:var(--line);font-weight:700}.assignment-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 13px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.assignment-frame-wrap{height:calc(100vh - 230px);min-height:540px;background:#fff}.assignment-frame{width:100%;height:100%;border:0;background:#fff}.project-tools{display:flex;gap:6px}.project-tools button,.project-tools a{font-size:11px}@media(max-width:700px){.project-body{padding:10px}.assignment-frame-wrap{height:calc(100vh - 210px)}.assignment-meta{align-items:flex-start;flex-direction:column}.desktop-label{display:none}}
  </style>
</head>
<body>
<div class="project-shell">
  <header class="project-topbar">
    <div class="project-brand"><a class="icon-btn" href="../" aria-label="Back to portfolio">←</a><div><div class="brand-title">College Projects</div><div class="brand-sub">Coursework archive</div></div></div>
    <div class="project-tools"><a class="tool-btn" href="../">Portfolio</a><button class="icon-btn" id="themeToggle">◐</button></div>
  </header>
  <main class="project-body">
    <section class="course-panel">
      <div class="course-head"><div class="eyebrow">College coursework</div><h1>IT 201</h1><p>Assignments are rendered in-place so you can move between them without reloading the College Projects workspace. Original source files remain in the repository.</p></div>
      <div class="assignment-tabs" role="tablist">
        <button class="assignment-tab active" data-assignment="1">Assignment 1</button>
        <button class="assignment-tab" data-assignment="2">Assignment 2</button>
        <button class="assignment-tab" data-assignment="3">Assignment 3</button>
        <button class="assignment-tab" data-assignment="4">Assignment 4</button>
        <button class="assignment-tab" data-assignment="5">Assignment 5</button>
      </div>
      <div class="assignment-meta"><span id="assignmentDescription">HTML/CSS heritage page</span><span><span class="desktop-label">Direct view: </span><a id="openAssignment" target="_blank" rel="noopener">Open assignment ↗</a></span></div>
      <div class="assignment-frame-wrap"><iframe class="assignment-frame" id="assignmentFrame" title="College assignment preview" src="../IT201/Assignment1/index.html"></iframe></div>
    </section>
  </main>
</div>
<script>
(() => {
 const map={
  1:{src:'../IT201/Assignment1/index.html',desc:'HTML/CSS heritage page'},
  2:{src:'../IT201/Assignment2/index.html',desc:'JavaScript validation and account verification interface'},
  3:{src:'../IT201/Assignment3/index.html',desc:'Database-backed dental records assignment — static GitHub Pages reconstruction'},
  4:{src:'../IT201/Assignment4/index.html',desc:'Dental account and appointment workflow — browser-based compatibility version'},
  5:{src:'../IT201/Assignment5/index.html',desc:'Real-time chat assignment — browser-based compatibility recreation'}
 };
 const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
 function show(n){const item=map[n]||map[1];qa('.assignment-tab').forEach(x=>x.classList.toggle('active',x.dataset.assignment==n));q('#assignmentFrame').src=item.src;q('#assignmentDescription').textContent=item.desc;q('#openAssignment').href=item.src;history.replaceState(null,'','#assignment-'+n)}
 qa('.assignment-tab').forEach(x=>x.addEventListener('click',()=>show(x.dataset.assignment)));
 const saved=localStorage.getItem('portfolioTheme');if(saved)document.documentElement.dataset.theme=saved;
 q('#themeToggle').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('portfolioTheme',next)});
 const m=location.hash.match(/assignment-(\d)/);show(m?m[1]:1);
})();
</script>
</body>
</html>
