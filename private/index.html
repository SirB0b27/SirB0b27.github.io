<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Workspaces | SirB0b27</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#101622;color:#edf5ff}
*{box-sizing:border-box}body{margin:0;background:#101622;color:#edf5ff}
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100dvh}.side{border-right:1px solid #354862;background:#152238;padding:25px 15px}.side h2{font-size:16px;margin:0 10px 24px}
.side a,.side button{width:100%;display:block;text-align:left;border:0;border-radius:9px;text-decoration:none;background:transparent;color:#c6d7ee;padding:12px;cursor:pointer;font:inherit}.side button.active,.side button:hover,.side a:hover{background:#25466d;color:#fff}
main{padding:29px clamp(20px,4vw,60px)}.eyebrow{font-size:12px;color:#9ebcdd;text-transform:uppercase;letter-spacing:.15em}.panel{max-width:520px;border:1px solid #405a7d;background:#1c2c44;border-radius:15px;padding:26px;margin-top:28px}
input{display:block;width:100%;padding:13px;margin:8px 0 17px;border-radius:8px;border:1px solid #6483aa;background:#0e1b30;color:white;font:inherit}
label{font-size:13px;color:#cfdef3}button{cursor:pointer;font:inherit}button.primary,.secondary{border:1px solid #4c8ccc;border-radius:9px;background:#296eac;color:white;padding:10px 16px;margin-right:8px}.secondary{background:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #415d7d;background:#1d304b;padding:20px;border-radius:13px}.card p,.muted{color:#b2c6e0;line-height:1.65}#status[role=status]{min-height:24px;color:#ffd0c5}.hidden{display:none!important}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#305377;border-radius:99px;padding:5px 9px;font-size:12px}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #354862;padding:14px}.side h2{margin:8px}.side nav{display:flex;overflow:auto}.side a,.side button{white-space:nowrap;width:auto;flex-shrink:0}main{padding:20px}}
</style></head><body>
<div class="shell"><aside class="side"><h2>Private Workspaces</h2><nav aria-label="Workspace navigation"><a href="../">← Workspace Home</a><button type="button" data-space="Portfolio">Portfolio</button><button type="button" data-space="Personal">Personal</button><div id="sectionsNav"></div></nav></aside>
<main><span class="eyebrow" id="crumb">Workspaces / Portfolio</span><h1 id="pageTitle">Portfolio</h1><p class="muted" id="pageSubtitle">Sign in to view protected content.</p>
<section class="panel" id="loginPanel"><h2>Sign in</h2><p class="muted">Your session and private files are managed by the backend.</p><form id="loginForm"><label for="email">Recovery email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Sign in</button><button class="secondary" type="button" id="forgot">Forgot password?</button></form></section>
<section class="panel hidden" id="resetPanel"><h2>Reset password</h2><form id="resetForm"><label for="recovery">Recovery email</label><input id="recovery" type="email" required><button class="secondary" type="button" id="sendCode">Send recovery code</button><label for="code">20-character recovery code</label><input id="code" maxlength="20" autocomplete="one-time-code" required><label for="newPassword">New password (12–256 characters)</label><input id="newPassword" type="password" minlength="12" required><button class="primary" type="submit">Change password</button><button class="secondary" type="button" id="back">Back to sign in</button></form></section>
<section class="hidden" id="contentPanel"><button class="secondary" type="button" id="logout">Sign out</button><div id="content"></div></section>
<p id="status" role="status" aria-live="polite"></p></main></div>
<script>
'use strict';
/* Intentionally not connected until an HTTPS bridge has been deployed and tested. */
const API_URL = 'https://github-private-workspaces.hemanth2355.workers.dev/';
const $=id=>document.getElementById(id);const state={space:'Portfolio',token:null,data:null};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){['loginPanel','resetPanel','contentPanel'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function message(s){$('status').textContent=s||''}
function setSpace(space){state.space=space;state.token=null;state.data=null;$('password').value='';$('sectionsNav').replaceChildren();$('content').replaceChildren();$('crumb').textContent='Workspaces / '+space;$('pageTitle').textContent=space;$('pageSubtitle').textContent='Sign in to view protected content.';document.querySelectorAll('[data-space]').forEach(x=>x.classList.toggle('active',x.dataset.space===space));history.replaceState(null,'','?workspace='+encodeURIComponent(space));show('loginPanel');message(API_URL?'':'Backend bridge not configured yet.');}
async function call(action,fields={}){if(!/^https:\/\//.test(API_URL))throw Error('Backend bridge not configured.');const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,workspace:state.space,...fields}),cache:'no-store',redirect:'follow'});if(!response.ok)throw Error('Request failed ('+response.status+').');const result=await response.json();if(!result.ok)throw Error(result.error||'Request failed.');return result.data}
async function act(fn){message('Working…');try{await fn();message('')}catch(e){message(e.message)}}
function renderSection(index){const s=state.data?.sections?.[index];if(!s)return;document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',Number(x.dataset.section)===index));const output=$('content');output.replaceChildren();const title=document.createElement('h2');title.textContent=s.title;output.append(title);for(const p of s.paragraphs||[]){const el=document.createElement('p');el.className='muted';el.textContent=p;output.append(el)}const grid=document.createElement('div');grid.className='cards';for(const item of s.items||[]){const card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+escapeHTML(item.title)+'</h3><p>'+escapeHTML(item.subtitle)+'</p><p>'+escapeHTML(item.description)+'</p><div class="tags">'+(item.tags||[]).map(x=>'<span class="tag">'+escapeHTML(x)+'</span>').join('')+'</div>';grid.append(card)}output.append(grid)}
function render(data){state.data=data;show('contentPanel');$('pageTitle').textContent=data.title||state.space;$('pageSubtitle').textContent=data.subtitle||'';const nav=$('sectionsNav');nav.replaceChildren();(data.sections||[]).forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.dataset.section=i;b.textContent=s.title;b.onclick=()=>renderSection(i);nav.append(b)});renderSection(0)}
document.querySelectorAll('[data-space]').forEach(x=>x.onclick=()=>setSpace(x.dataset.space));
$('loginForm').onsubmit=e=>{e.preventDefault();act(async()=>{const result=await call('login',{email:$('email').value,password:$('password').value});state.token=result.token;$('password').value='';try{render(await call('content',{token:state.token}))}catch(err){state.token=null;throw err}})};
$('forgot').onclick=()=>{show('resetPanel');$('recovery').value=$('email').value;message('')};$('back').onclick=()=>{show('loginPanel');message('')};
$('sendCode').onclick=()=>act(async()=>{const result=await call('requestReset',{email:$('recovery').value});message(result.message||'If the email matches, a code will be sent.')});
$('resetForm').onsubmit=e=>{e.preventDefault();act(async()=>{const result=await call('completeReset',{email:$('recovery').value,code:$('code').value,newPassword:$('newPassword').value});$('code').value='';$('newPassword').value='';show('loginPanel');message(result.message||'Password updated.')})};
$('logout').onclick=()=>act(async()=>{const token=state.token;state.token=null;state.data=null;$('content').replaceChildren();$('sectionsNav').replaceChildren();show('loginPanel');await call('logout',{token})});
setSpace(new URLSearchParams(location.search).get('workspace')?.toLowerCase()==='personal'?'Personal':'Portfolio');
</script></body></html>
